<svg width="220" height="320" viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c49f"/>
      <stop offset="0.38" stop-color="#d99b73"/>
      <stop offset="0.72" stop-color="#b87452"/>
      <stop offset="1" stop-color="#8f543e"/>
    </linearGradient>
    <linearGradient id="finger" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffd1ad"/>
      <stop offset="0.48" stop-color="#dda17b"/>
      <stop offset="1" stop-color="#a76249"/>
    </linearGradient>
    <radialGradient id="highlight" cx="35%" cy="22%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".48"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#6b2f21" stop-opacity=".18"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- index finger -->
    <rect x="89" y="6" width="48" height="174" rx="24" fill="url(#finger)"/>
    <ellipse cx="113" cy="28" rx="19" ry="17" fill="#f0b994" opacity=".52"/>
    <path d="M101 17c7-7 20-8 28 1-1 8-5 14-12 16-8 2-14-2-16-8z" fill="#f4c7ad" opacity=".62"/>
    <!-- palm -->
    <path d="M68 133c4-20 17-33 37-34 18-1 31 11 36 27l9 25c4 13 17 18 27 26 18 15 25 39 20 63-6 31-27 58-55 69-30 12-66 7-89-15-21-20-28-50-21-77 5-20 18-36 25-54 5-13 6-22 11-30z" fill="url(#skin)"/>
    <!-- middle finger -->
    <rect x="132" y="101" width="37" height="108" rx="18" transform="rotate(6 132 101)" fill="url(#skin)"/>
    <!-- ring finger -->
    <rect x="157" y="128" width="32" height="91" rx="16" transform="rotate(12 157 128)" fill="url(#skin)"/>
    <!-- little finger -->
    <rect x="175" y="156" width="27" height="71" rx="13" transform="rotate(17 175 156)" fill="url(#skin)"/>
    <!-- thumb -->
    <path d="M69 168c-11-11-25-15-37-8-14 8-19 25-12 39 8 15 27 29 45 35 13 5 28-2 32-15 4-12-4-24-15-31z" fill="url(#finger)"/>
    <!-- lighting -->
    <path d="M70 136c11-25 45-35 64-16 13 13 11 30 21 43 8 11 22 14 31 24 20 23 12 67-10 90-18 18-45 28-70 22-30-7-50-32-53-60-2-21 6-37 15-54 7-14-3-31 2-49z" fill="url(#highlight)" opacity=".7"/>
    <!-- knuckle shadows -->
    <path d="M91 160c23-10 50-7 67 8" fill="none" stroke="#7b3f30" stroke-opacity=".22" stroke-width="7" stroke-linecap="round"/>
    <path d="M76 205c25-12 55-9 74 6" fill="none" stroke="#7b3f30" stroke-opacity=".15" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
